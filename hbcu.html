<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historically Black Colleges & Universities (HBCUs)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    #map { height: calc(100vh - 73px); }
    .custom-popup .leaflet-popup-content-wrapper {
      background: #1f2937;
      color: #f3f4f6;
      border-radius: 0.5rem;
      padding: 4px;
      border: 1px solid #374151;
    }
    .custom-popup .leaflet-popup-tip {
      background: #1f2937;
    }
    .dot-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .dot-pin:hover {
      transform: scale(1.4);
      z-index: 1000 !important;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header & Filters -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex flex-wrap items-center justify-between gap-4 z-10 shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center font-bold text-gray-900 text-sm">HBCU</div>
      <h1 class="text-xl font-bold tracking-tight text-white">Historically Black Colleges & Universities</h1>
    </div>
    
    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
      <input type="text" id="searchInput" placeholder="Search name, mascot, city..." 
        class="bg-gray-700 text-white text-sm rounded-lg px-3 py-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500 w-full sm:w-64" />
      
      <select id="typeFilter" class="bg-gray-700 text-white text-sm rounded-lg px-3 py-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500">
        <option value="All">All Types</option>
        <option value="Public">Public</option>
        <option value="Private">Private</option>
      </select>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Sidebar -->
    <aside class="w-full md:w-80 bg-gray-800 border-r border-gray-700 flex flex-col h-full z-0">
      <div class="p-3 bg-gray-800/80 border-b border-gray-700 text-xs text-gray-400 font-medium flex justify-between items-center">
        <span>INSTITUTIONS (<span id="count">0</span>)</span>
        <span class="text-amber-400">Click card to zoom</span>
      </div>
      <div id="hbcuList" class="flex-1 overflow-y-auto divide-y divide-gray-700/50">
        <!-- Dynamic list -->
      </div>
    </aside>

    <!-- Map Container -->
    <main class="flex-1 h-full relative">
      <div id="map" class="w-full h-full"></div>
    </main>
  </div>
