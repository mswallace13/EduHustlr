    </div>

      { name: "Prairie View A&M University", city: "Prairie View", state: "TX", lat: 30.0949, lng: -95.9904, est: 1876, mascot: "Panthers", enrollment: "~9,200", type: "Public", url: "https://pvamu.edu" },
      { name: "Southwestern Christian College", city: "Terrell", state: "TX", lat: 32.7308, lng: -96.2806, est: 1948, mascot: "Rams", enrollment: "~100", type: "Private", url: "https://swcc.edu" },
      { name: "St. Philip's College", city: "San Antonio", state: "TX", lat: 29.4181, lng: -98.4553, est: 1898, mascot: "Tigers", enrollment: "~11,000", type: "Public", url: "https://alamo.edu/spc" },
      { name: "Texas College", city: "Tyler", state: "TX", lat: 32.3689, lng: -95.3214, est: 1894, mascot: "Steers", enrollment: "~600", type: "Private", url: "https://texascollege.edu" },
      { name: "Texas Southern University", city: "Houston", state: "TX", lat: 29.7214, lng: -95.3606, est: 1927, mascot: "Tigers", enrollment: "~7,500", type: "Public", url: "https://tsu.edu" },
      { name: "Wiley University", city: "Marshall", state: "TX", lat: 32.5408, lng: -94.3806, est: 1873, mascot: "Wildcats", enrollment: "~600", type: "Private", url: "https://wileyc.edu" },

      // US VIRGIN ISLANDS
      { name: "University of the Virgin Islands", city: "St. Thomas", state: "VI", lat: 18.3444, lng: -64.9744, est: 1962, mascot: "Buccaneers", enrollment: "~1,800", type: "Public", url: "https://uvi.edu" },

      // VIRGINIA
      { name: "Hampton University", city: "Hampton", state: "VA", lat: 37.0213, lng: -76.3353, est: 1868, mascot: "Pirates", enrollment: "~3,500", type: "Private", url: "https://hamptonu.edu" },
      { name: "Norfolk State University", city: "Norfolk", state: "VA", lat: 36.8485, lng: -76.2624, est: 1935, mascot: "Spartans", enrollment: "~5,400", type: "Public", url: "https://nsu.edu" },
      { name: "Virginia State University", city: "Petersburg", state: "VA", lat: 37.2389, lng: -77.4190, est: 1882, mascot: "Trojans", enrollment: "~4,300", type: "Public", url: "https://vsu.edu" },
      { name: "Virginia Union University", city: "Richmond", state: "VA", lat: 37.5628, lng: -77.4519, est: 1865, mascot: "Panthers", enrollment: "~1,700", type: "Private", url: "https://vuu.edu" },
      { name: "Virginia University of Lynchburg", city: "Lynchburg", state: "VA", lat: 37.4056, lng: -79.1606, est: 1886, mascot: "Dragons", enrollment: "~700", type: "Private", url: "https://vul.edu" },

      // WEST VIRGINIA
      { name: "Bluefield State University", city: "Bluefield", state: "WV", lat: 37.2625, lng: -81.2464, est: 1895, mascot: "Big Blue", enrollment: "~1,300", type: "Public", url: "https://bluefieldstate.edu" },
      { name: "West Virginia State University", city: "Institute", state: "WV", lat: 38.3842, lng: -81.7667, est: 1891, mascot: "Yellow Jackets", enrollment: "~3,400", type: "Public", url: "https://wvstateu.edu" }
    ];

    // Initialize Map Centered on US
    const map = L.map('map').setView([36.5, -89.5], 5);

// Dark Map Tiles (CARTO Dark Matter)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

    let activeMarkers = [];

    // Icon Customizer
    function getMarkerIcon(type) {
      const color = type === 'Public' ? '#f59e0b' : '#38bdf8';
      return L.divIcon({
        className: 'custom-pin',
        html: `<div style="background-color: ${color}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 6px ${color};"></div>`,
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });
    }

    // Render Function
    function render(data) {
      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];

      const listEl = document.getElementById('hbcuList');
      listEl.innerHTML = '';
      document.getElementById('count').textContent = data.length;

      data.forEach((hbcu) => {
        const marker = L.marker([hbcu.lat, hbcu.lng], { icon: getMarkerIcon(hbcu.type) }).addTo(map);
        
        const popupContent = `
          <div class="p-2 max-w-xs">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs px-2 py-0.5 rounded font-semibold ${hbcu.type === 'Public' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-sky-500/20 text-sky-400 border border-sky-500/30'}">${hbcu.type}</span>
              <span class="text-xs text-gray-400">${hbcu.city}, ${hbcu.state}</span>
            </div>
            <h3 class="font-bold text-base text-white mb-2 leading-tight">${hbcu.name}</h3>
            <div class="text-xs text-gray-300 space-y-1 mb-3">
              <div><strong class="text-gray-400">Established:</strong> ${hbcu.est}</div>
              <div><strong class="text-gray-400">Mascot:</strong> ${hbcu.mascot}</div>
              <div><strong class="text-gray-400">Enrollment:</strong> ${hbcu.enrollment}</div>
            </div>
            <a href="${hbcu.url}" target="_blank" rel="noopener noreferrer" 
               class="block text-center w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold text-xs py-1.5 px-3 rounded transition-colors">
              Visit Website (.edu) &rarr;
            </a>
          </div>
        `;

        marker.bindTooltip(`<b>${hbcu.name}</b><br/>${hbcu.city}, ${hbcu.state}`, { direction: 'top', offset: [0, -5] });
        marker.bindPopup(popupContent, { className: 'custom-popup' });

        activeMarkers.push(marker);

        const card = document.createElement('div');
        card.className = "p-3 hover:bg-gray-700/50 cursor-pointer transition-colors border-b border-gray-700/50";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-semibold text-sm text-gray-200 hover:text-amber-400 leading-snug">${hbcu.name}</h4>
            <span class="text-[10px] px-1.5 py-0.5 rounded ${hbcu.type === 'Public' ? 'bg-amber-500/10 text-amber-400' : 'bg-sky-500/10 text-sky-400'}">${hbcu.type}</span>
          </div>
          <p class="text-xs text-gray-400">${hbcu.city}, ${hbcu.state} • Est. ${hbcu.est}</p>
          <p class="text-xs text-gray-400">Mascot: <span class="text-gray-300">${hbcu.mascot}</span></p>
        `;

        card.addEventListener('click', () => {
          map.setView([hbcu.lat, hbcu.lng], 12);
          marker.openPopup();
        });

        listEl.appendChild(card);
      });
    }

    // Filter Logic
    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('typeFilter').value;

      const filtered = hbcus.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(query) ||
                              item.city.toLowerCase().includes(query) ||
                              item.state.toLowerCase().includes(query) ||
                              item.mascot.toLowerCase().includes(query);
        const matchesType = type === 'All' || item.type === type;
        return matchesSearch && matchesType;
      });

      render(filtered);
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('typeFilter').addEventListener('change', filterData);

    // Initial Render
    render(hbcus);
  </script>
</body>
</html>
