<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historically Black Colleges & Universities (HBCUs)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    #map { height: calc(100vh - 73px); }
    .custom-popup .leaflet-popup-content-wrapper {
      background: #1f2937;
      color: #f3f4f6;
      border-radius: 0.5rem;
      padding: 4px;
      border: 1px solid #374151;
    }
    .custom-popup .leaflet-popup-tip {
      background: #1f2937;
    }
    .dot-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .dot-pin:hover {
      transform: scale(1.4);
      z-index: 1000 !important;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header & Filters -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex flex-wrap items-center justify-between gap-4 z-10 shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center font-bold text-gray-900 text-sm">HBCU</div>
      <h1 class="text-xl font-bold tracking-tight text-white">Historically Black Colleges & Universities</h1>
    </div>
    
    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
      <input type="text" id="searchInput" placeholder="Search name, mascot, city..." 
        class="bg-gray-700 text-white text-sm rounded-lg px-3 py-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500 w-full sm:w-64" />
      
      <select id="typeFilter" class="bg-gray-700 text-white text-sm rounded-lg px-3 py-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500">
        <option value="All">All Types</option>
        <option value="Public">Public</option>
        <option value="Private">Private</option>
      </select>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Sidebar -->
    <aside class="w-full md:w-80 bg-gray-800 border-r border-gray-700 flex flex-col h-full z-0">
      <div class="p-3 bg-gray-800/80 border-b border-gray-700 text-xs text-gray-400 font-medium flex justify-between items-center">
        <span>INSTITUTIONS (<span id="count">0</span>)</span>
        <span class="text-amber-400">Click card to zoom</span>
      </div>
      <div id="hbcuList" class="flex-1 overflow-y-auto divide-y divide-gray-700/50">
        <!-- Dynamic list -->
      </div>
    </aside>

    <!-- Map Container -->
    <main class="flex-1 h-full relative">
      <div id="map" class="w-full h-full"></div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    let hbcus = [];
    let activeMarkers = [];

    // Initialize Map
    const map = L.map('map').setView([36.5, -89.5], 5);

    // Key-Free Dark Tiles
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    function createDotIcon(item) {
      const color = item.type === 'Public' ? '#f59e0b' : '#38bdf8';
      const html = `<div style="background-color: ${color}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 8px ${color};"></div>`;
      return L.divIcon({
        className: 'dot-pin',
        html: html,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
    }

    function render(data) {
      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];

      const listEl = document.getElementById('hbcuList');
      listEl.innerHTML = '';
      document.getElementById('count').textContent = data.length;

      data.forEach((hbcu) => {
        const marker = L.marker([hbcu.lat, hbcu.lng], { icon: createDotIcon(hbcu) }).addTo(map);
        
        const popupContent = `
          <div class="p-2 max-w-xs">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs px-2 py-0.5 rounded font-semibold ${hbcu.type === 'Public' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-sky-500/20 text-sky-400 border border-sky-500/30'}">${hbcu.type}</span>
              <span class="text-xs text-gray-400">${hbcu.city}, ${hbcu.state}</span>
            </div>
            <h3 class="font-bold text-base text-white mb-1 leading-tight">${hbcu.name}</h3>
            <div class="text-xs text-gray-300 space-y-1 mb-3">
              <div><strong class="text-gray-400">Established:</strong> ${hbcu.est}</div>
              <div><strong class="text-amber-400 font-semibold">Mascot:</strong> ${hbcu.mascot}</div>
            </div>
            <a href="${hbcu.url}" target="_blank" rel="noopener noreferrer" 
               class="block text-center w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold text-xs py-1.5 px-3 rounded transition-colors">
              Visit Official Site (.edu) &rarr;
            </a>
          </div>
        `;

        marker.bindTooltip(`<b>${hbcu.name}</b><br/><span style="color:#f59e0b;">🐾 ${hbcu.mascot}</span>`, { direction: 'top', offset: [0, -5] });
        marker.bindPopup(popupContent, { className: 'custom-popup' });
        activeMarkers.push(marker);

        const card = document.createElement('div');
        card.className = "p-3 hover:bg-gray-700/50 cursor-pointer transition-colors border-b border-gray-700/50 flex items-center justify-between gap-2";
        card.innerHTML = `
          <div>
            <h4 class="font-semibold text-sm text-gray-200 hover:text-amber-400 leading-snug">${hbcu.name}</h4>
            <p class="text-xs text-gray-400">${hbcu.city}, ${hbcu.state} • Est. ${hbcu.est}</p>
            <p class="text-xs text-amber-400 mt-0.5">🐾 ${hbcu.mascot}</p>
          </div>
          <span class="text-xs font-bold px-2 py-0.5 rounded-full ${hbcu.type === 'Public' ? 'bg-amber-500/20 text-amber-400' : 'bg-sky-500/20 text-sky-400'}">
            ${hbcu.type}
          </span>
        `;

        card.addEventListener('click', () => {
          map.setView([hbcu.lat, hbcu.lng], 14);
          marker.openPopup();
        });

        listEl.appendChild(card);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('typeFilter').value;

      const filtered = hbcus.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(query) ||
                              item.city.toLowerCase().includes(query) ||
                              item.state.toLowerCase().includes(query) ||
                              item.mascot.toLowerCase().includes(query);
        const matchesType = type === 'All' || item.type === type;
        return matchesSearch && matchesType;
      });

      render(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('typeFilter').addEventListener('change', filterData);

    // Fetch dataset relative to hbcu.html
    fetch('hbcu.json')
      .then(res => res.json())
      .then(data => {
        hbcus = data;
        render(hbcus);
      })
      .catch(err => console.error("Error loading HBCU data:", err));
  </script>
</body>
</html>
